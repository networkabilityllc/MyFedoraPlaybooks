
---
- name: Execute Initial Fedora Setup Commands
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    minimum_user_uid: 1000
    maximum_user_uid: 65533

    system_packages:
      - 7zip
      - bat
      - cowsay
      - duf
      - fastfetch
      - fd-find
      - fortune-mod
      - fzf
      - gcc
      - gcc-c++
      - glibc-langpack-en
      - iftop
      - make
      - micro
      - net-tools
      - pam
      - python3
      - python3-docker
      - python3-pip
      - rpm-build
      - screen
      - unzip

  tasks:
    - name: Verify that the target is Fedora
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Fedora"
        fail_msg: "This playbook supports Fedora only."
        success_msg: "Fedora detected."

    - name: Check if cloud-init is present
      ansible.builtin.stat:
        path: /etc/cloud
      register: cloud_init_dir

    - name: Ensure system configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/systemd/system/getty@tty1.service.d
        - /etc/systemd/journald.conf.d

    - name: Add cloud-init wait configuration
      ansible.builtin.blockinfile:
        path: /etc/systemd/system/getty@tty1.service.d/cloud-init_wait.conf
        create: true
        owner: root
        group: root
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - cloud-init wait"
        block: |
          [Unit]
          After=cloud-final.service
      when: cloud_init_dir.stat.exists

    - name: Install system package dependencies
      ansible.builtin.dnf:
        name: "{{ system_packages }}"
        state: present
        update_cache: true

    - name: Configure system locale
      ansible.builtin.lineinfile:
        path: /etc/locale.conf
        regexp: '^LANG='
        line: 'LANG=en_US.UTF-8'
        state: present
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Configure journald retention limits
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-limits.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          SystemMaxUse=200M
          SystemKeepFree=500M
          MaxRetentionSec=14day
      notify: Restart systemd-journald

    - name: Configure system-wide screenrc
      ansible.builtin.blockinfile:
        path: /etc/screenrc
        create: true
        owner: root
        group: root
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - screenrc"
        block: |
          startup_message off
          nethack on
          vbell_msg ''
          termcapinfo *  vb=:
          altscreen on
          bindkey -k up send-up
          bindkey -k dn send-down

    - name: Read local user accounts
      ansible.builtin.getent:
        database: passwd

    - name: Initialize interactive user list
      ansible.builtin.set_fact:
        interactive_users: []

    - name: Build list of interactive users
      ansible.builtin.set_fact:
        interactive_users: >-
          {{
            interactive_users + [
              {
                'name': item.key,
                'home': item.value[4],
                'gid': item.value[2]
              }
            ]
          }}
      loop: "{{ getent_passwd | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value[1] | int >= minimum_user_uid
        - item.value[1] | int <= maximum_user_uid
        - item.value[4] is match('^/home/[^/]+$')
        - item.value[5] not in ['/sbin/nologin', '/usr/sbin/nologin', '/bin/false']

    - name: Add root to target home directory list
      ansible.builtin.set_fact:
        target_homes: >-
          {{
            interactive_users + [
              {
                'name': 'root',
                'home': '/root',
                'gid': '0'
              }
            ]
          }}

    - name: Include skeleton directory for shell configuration
      ansible.builtin.set_fact:
        shell_config_homes: >-
          {{
            target_homes + [
              {
                'name': 'root',
                'home': '/etc/skel',
                'gid': '0'
              }
            ]
          }}

    - name: Check target home directories
      ansible.builtin.stat:
        path: "{{ item.home }}"
      loop: "{{ target_homes }}"
      loop_control:
        label: "{{ item.home }}"
      register: target_home_stats

    - name: Keep only existing home directories
      ansible.builtin.set_fact:
        target_homes: >-
          {{
            target_home_stats.results
            | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir', 'equalto', true)
            | map(attribute='item')
            | list
          }}

    - name: Rebuild shell configuration home list
      ansible.builtin.set_fact:
        shell_config_homes: >-
          {{
            target_homes + [
              {
                'name': 'root',
                'home': '/etc/skel',
                'gid': '0'
              }
            ]
          }}

    - name: Deploy inputrc to users, root, and skel
      ansible.builtin.copy:
        dest: "{{ item.home }}/.inputrc"
        owner: "{{ item.name }}"
        group: "{{ item.gid }}"
        mode: '0644'
        content: |
          set completion-ignore-case on
          set show-all-if-ambiguous on
          set show-all-if-unmodified on
          set completion-display-width 0
          set colored-completion-prefix on
          set colored-stats on
          set menu-complete-display-prefix on
          set enable-keypad on
          set visible-stats on
          set history-preserve-point on
          set history-size 10000

          "\e[1;3A": history-search-backward
          "\e[1;3B": history-search-forward
          "\e[1;5C": forward-word
          "\e[1;5D": backward-word
          "\e[H": beginning-of-line
          "\e[F": end-of-line
          "\e[3~": delete-char
          set match-hidden-files on
      loop: "{{ shell_config_homes }}"
      loop_control:
        label: "{{ item.home }}"

    - name: Ensure local share directories exist
      ansible.builtin.file:
        path: "{{ item.home }}/.local/share"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.gid }}"
        mode: '0700'
      loop: "{{ target_homes }}"
      loop_control:
        label: "{{ item.home }}"

    - name: Configure bashrc additions for users, root, and skel
      ansible.builtin.blockinfile:
        path: "{{ item.home }}/.bashrc"
        create: true
        owner: "{{ item.name }}"
        group: "{{ item.gid }}"
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - MOTD + fzf helper"
        block: |
          if [[ $- == *i* ]]; then
              if [[ "${_FASTFETCH_SHOWN:-0}" != "1" ]]; then
                  if command -v fastfetch >/dev/null 2>&1; then
                      clear
                      fastfetch --logo none
                      echo
                  fi
                  _FASTFETCH_SHOWN=1
              fi
          fi

          alias dfl='duf --only local'
          alias clr='source ~/.bashrc'
          alias dh='du . -h'

          export FZF_DEFAULT_COMMAND='fd --hidden'
          export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"

          if [ -r /usr/share/fzf/shell/key-bindings.bash ]; then
              source /usr/share/fzf/shell/key-bindings.bash
          elif [ -r /usr/share/doc/fzf/examples/key-bindings.bash ]; then
              source /usr/share/doc/fzf/examples/key-bindings.bash
          fi

          fz() {
              local dir="${1:-.}"
              local selection

              while true; do
                  selection=$(
                      {
                          printf '%s\n' "$dir/.."
                          find "$dir" -mindepth 1 -maxdepth 1 2>/dev/null
                      } | fzf \
                          --prompt="$dir > " \
                          --preview '
                              if [ -d {} ]; then
                                  ls -la --color=always {}
                              else
                                  bat --style=plain --color=always {} 2>/dev/null
                              fi
                          '
                  ) || return

                  if [ -d "$selection" ]; then
                      dir=$(cd "$selection" 2>/dev/null && pwd) || continue
                  elif [ -f "$selection" ]; then
                      micro "$selection"
                  fi
              done
          }

          zl() {
              command zellij "$@"
              clr
          }
      loop: "{{ shell_config_homes }}"
      loop_control:
        label: "{{ item.home }}"

    - name: Disable cloud-init on non-guest systems
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        access_time: preserve
        modification_time: preserve
        owner: root
        group: root
        mode: '0644'
      when:
        - cloud_init_dir.stat.exists
        - ansible_virtualization_role != "guest"

  handlers:
    - name: Restart systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
